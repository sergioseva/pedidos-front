name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g. v1.0.0)'
        required: true

# Solo produccion: staging esta apagado a proposito y ofrecerlo como destino haria perder
# tiempo justo en un rollback, que es cuando algo ya salio mal.
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy pedidos-front:${{ inputs.version }} to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/sergioseva/pedidos-front:${{ inputs.version }}
            docker tag ghcr.io/sergioseva/pedidos-front:${{ inputs.version }} ghcr.io/sergioseva/pedidos-front:latest
            cd /aplicaciones/pedidos/docker
            docker compose up -d --no-deps pedidos-fo
