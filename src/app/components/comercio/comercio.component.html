<div class="auth-wrapper">
    <div class="col-sm-9 col-md-7 col-lg-6 mx-auto">
        <div class="card" style="margin-top: 2rem; margin-bottom: 2rem;">
            <div class="card-header">
                <div class="card-icon-header">
                    <i class="fa fa-shopping-bag"></i>
                    <span>{{headerText}}</span>
                </div>
            </div>
            <div class="card-body">
                <form [formGroup]="forma" (ngSubmit)="onSubmit()" #registroForm="ngForm">

                    <div class="form-group">
                        <label>Nombre del negocio</label>
                        <input type="text"
                            class="form-control"
                            placeholder="Ej: Hotel Costa Azul"
                            formControlName="descripcion"
                            [ngClass]="{ 'is-invalid': !forma.controls['descripcion'].valid && forma.controls['descripcion'].touched }">
                        <div *ngIf="forma.get('descripcion').errors?.required && forma.controls['descripcion'].touched"
                            class="small text-error">
                            El nombre es necesario.
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Direccion</label>
                        <input type="text" class="form-control" placeholder="Direccion" formControlName="direccion">
                    </div>

                    <div class="form-group">
                        <label>Persona de contacto</label>
                        <input type="text" class="form-control" placeholder="Contacto" formControlName="contacto">
                    </div>

                    <div class="form-group">
                        <label>Telefono</label>
                        <input type="text" class="form-control" placeholder="Telefono" formControlName="telefono">
                    </div>

                    <div class="form-group">
                        <label>CUIT</label>
                        <input type="text" class="form-control" placeholder="CUIT" formControlName="cuit">
                    </div>

                    <div class="form-group">
                        <label>Comision (%)</label>
                        <input type="number" min="0" max="100" step="0.5"
                            class="form-control"
                            placeholder="Ej: 20"
                            formControlName="comision"
                            [ngClass]="{ 'is-invalid': !forma.controls['comision'].valid && forma.controls['comision'].touched }">
                        <div class="small" style="color: #8C7A6A; margin-top: 0.25rem;">
                            Porcentaje que el negocio retiene de cada venta. Vacio = paga el precio de tapa completo.
                        </div>
                        <div *ngIf="!forma.controls['comision'].valid && forma.controls['comision'].touched"
                            class="small text-error">
                            La comision debe estar entre 0 y 100.
                        </div>
                    </div>

                    <div class="row" style="margin-top: 1.5rem;">
                        <div class="col-6">
                            <button [disabled]="!forma.valid || guardando" class="btn btn-action btn-block" type="submit">
                                <i class="fa fa-save" style="margin-right: 0.25rem;"></i> {{ guardando ? 'Guardando...' : 'Guardar' }}
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-action-secondary btn-block" type="button" [routerLink]="['/comercios']">
                                <i class="fa fa-times" style="margin-right: 0.25rem;"></i> Cancelar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
